# livekit/livekit.yml — copy to `livekit.yml` on the voice box and fill in.
#
# livekit/compose.yml mounts ./livekit.yml at /etc/livekit.yaml and starts the
# SFU with `--config /etc/livekit.yaml`. That file is deliberately absent from
# the repo (it holds the API secret) and deploy-voice.sh excludes it from the
# rsync, so a deploy never overwrites what is on the box. This template exists
# because upstream ships no example and the SFU will not start without it.

port: 7880

rtc:
  # UDP range for media. Every one of these ports must be open on the host
  # firewall or audio connects and then silently carries nothing.
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  # `true` because compose.yml runs this container with network_mode: host,
  # so the container sees the real interface and can discover its own IP.
  use_external_ip: true

# Must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in server/.env exactly.
# Generate a pair: docker run --rm livekit/livekit-server generate-keys
keys:
  APIyourkeyhere: your-api-secret-here

# The redis service in compose.yml, published on 127.0.0.1:6379. Required
# once you run more than one SFU node; harmless and recommended at one node.
redis:
  address: 127.0.0.1:6379

logging:
  level: info
  json: false

# TLS terminates at your reverse proxy (Caddy/nginx), which is what serves
# LIVEKIT_PUBLIC_URL and proxies the WebSocket upgrade to 127.0.0.1:7880.
# Do not also configure certificates here.
