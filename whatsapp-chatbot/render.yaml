services:
  - type: web
    name: earthora-whatsapp-chatbot
    runtime: node
    rootDir: .
    plan: free
    region: singapore
    buildCommand: cd voice-service && npm ci --include=dev --no-audit --no-fund --loglevel=info && npm run build:whatsapp
    startCommand: cd voice-service && npm run start:whatsapp
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PUBLIC_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_STT_MODEL
        value: gpt-4o-mini-transcribe
      - key: LLM_PROVIDER
        value: openai
      - key: STT_PROVIDER
        value: openai
      - key: TTS_PROVIDER
        value: openai
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TOKEN_SIGNING_SECRET
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: tata_omni
      - key: TATA_OMNI_ACCESS_TOKEN
        sync: false
      - key: TATA_OMNI_API_BASE_URL
        value: https://wb.omni.tatatelebusiness.com
      - key: TATA_OMNI_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_CHECKOUT_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_CHECKOUT_TEMPLATE_LANGUAGE
        value: en
      - key: VOICE_CHECKOUT_TTL_MINUTES
        value: "30"
