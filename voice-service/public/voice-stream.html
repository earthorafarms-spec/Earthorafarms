<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Earthora Voice Agent — Live Call (dev only)</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #FAF9F5; color: #15271D; }
  h1 { font-size: 18px; }
  .warn { font-size: 12px; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
  #log { border: 1px solid #CFDCD3; border-radius: 12px; background: #fff; padding: 12px; min-height: 280px; max-height: 55vh; overflow-y: auto; margin-bottom: 16px; }
  .msg { margin-bottom: 12px; line-height: 1.4; }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #888; display: block; margin-bottom: 2px; }
  .msg.user .role { color: #26593B; }
  .msg.assistant .role { color: #7c5e10; }
  .msg.system .role { color: #999; }
  .msg .lang { font-size: 10px; color: #aaa; margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #call-btn {
    width: 110px; height: 110px; border-radius: 50%; border: none; cursor: pointer;
    background: #26593B; color: white; font-size: 34px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, box-shadow 0.2s; user-select: none;
  }
  #call-btn.active { background: #b91c1c; box-shadow: 0 0 0 8px rgba(185,28,28,0.15); }
  #status { font-size: 13px; color: #666; min-height: 18px; text-align: center; }
  #status.error { color: #b91c1c; }
  #status.speaking { color: #92400e; font-weight: 600; }
  #status.listening { color: #26593B; font-weight: 600; }
</style>
</head>
<body>
  <h1>Earthora Voice Agent — live call</h1>
  <p class="warn">
    Development tool only. Press the button once to start — the agent greets you automatically,
    then just talk. Silence detection ends your turn; the agent replies when done. English, Hindi,
    or Gujarati, no need to pick.
  </p>
  <div id="log"></div>
  <div class="controls">
    <button id="call-btn">📞</button>
    <div id="status">Press to start the call.</div>
  </div>

<script>
  const log = document.getElementById('log');
  const btn = document.getElementById('call-btn');
  const statusEl = document.getElementById('status');

  let ws = null;
  let sessionId = null;
  let audioCtx = null;
  let micStream = null;
  let workletNode = null;
  let callActive = false;

  // Agent-floor state — true from user_transcript through end of ALL agent audio.
  let serverProcessing = false;
  // AudioContext used for gapless playback of streamed sentence WAVs.
  // AudioBufferSourceNodes are scheduled back-to-back at sample-accurate times,
  // eliminating the ~200-500ms gap that <Audio> elements introduce between
  // consecutive clips (due to element construction + browser audio scheduling).
  let playCtx = null;
  let nextSoundStart = 0; // AudioContext timestamp when the next buffer should start
  let playingCount = 0;   // number of scheduled sources not yet ended
  let pendingDecodes = 0; // number of decodeAudioData calls not yet resolved
  let audioTurnComplete = false; // true once server sends agent_audio_end
  let pendingCallEnd = false;    // true when call should end after audio drains
  // Client-side energy gate: blocks ambient hum, fan noise, and background TV
  // from reaching the server. 200 is well above DC bias / unplugged-mic noise
  // (~0-30) but comfortably below normal speech (~1000-8000), so real speech
  // always gets through while idle-room noise doesn't. The server still
  // receives the post-speech silence chunks it needs to trigger flush because
  // real speech residual decays through ~200 gradually, not a hard cut-off.
  const MIN_TRANSMIT_RMS = 30;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  function addMessage(role, text, lang) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const langTag = lang ? '<span class="lang">(' + lang + ')</span>' : '';
    div.innerHTML = '<span class="role">' + role + langTag + '</span>' + (text || '').replace(/</g, '&lt;');
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function getPlayCtx() {
    if (!playCtx || playCtx.state === 'closed') {
      playCtx = new AudioContext();
      nextSoundStart = 0;
    }
    if (playCtx.state === 'suspended') playCtx.resume().catch(() => {});
    return playCtx;
  }

  function stopCurrentPlayback() {
    if (playCtx && playCtx.state !== 'closed') {
      playCtx.close().catch(() => {});
      playCtx = null;
    }
    playingCount = 0;
    pendingDecodes = 0;
    nextSoundStart = 0;
    audioTurnComplete = false;
    pendingCallEnd = false;
    serverProcessing = false;
    setStatus('Listening…', 'listening');
  }

  // Called by source.onended when all scheduled buffers finish, and by the
  // agent_audio_end / call_end handlers when no audio was queued at all.
  function onAllAudioDone() {
    audioTurnComplete = false;
    serverProcessing = false;
    if (pendingCallEnd) {
      pendingCallEnd = false;
      endCall();
    } else {
      setStatus('Listening…', 'listening');
      // Signal server that audio playback is done — it will now start the
      // inactivity timer. Without this the server has no way to know how long
      // the client takes to play all the buffered audio.
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'audio_done' }));
      }
    }
  }

  // Decode a WAV ArrayBuffer and schedule it for gapless playback immediately
  // after whatever is already playing. Uses AudioContext.currentTime so
  // back-to-back buffers play with sample-accurate zero-gap timing.
  async function playReplyAudio(arrayBuffer) {
    const ctx = getPlayCtx();
    let audioBuffer;
    try {
      audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
    } catch {
      // Decode failed — count it as done so the "all done" check still fires.
      pendingDecodes = Math.max(0, pendingDecodes - 1);
      if (playingCount === 0 && pendingDecodes === 0 && audioTurnComplete) onAllAudioDone();
      return;
    }
    if (ctx !== playCtx) {
      // Context replaced (call ended mid-decode) — drop the buffer.
      pendingDecodes = Math.max(0, pendingDecodes - 1);
      return;
    }

    setStatus('Agent speaking…', 'speaking');

    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(ctx.destination);

    const startAt = Math.max(ctx.currentTime + 0.01, nextSoundStart);
    source.start(startAt);
    nextSoundStart = startAt + audioBuffer.duration;
    playingCount++;
    // Decrement AFTER playingCount++ so the "all done" guard never fires
    // between the two — prevents a window where both counters are 0 mid-decode.
    pendingDecodes = Math.max(0, pendingDecodes - 1);

    source.onended = () => {
      if (ctx !== playCtx) return;
      playingCount = Math.max(0, playingCount - 1);
      if (playingCount === 0 && pendingDecodes === 0 && audioTurnComplete) onAllAudioDone();
    };
  }

  function rms(int16arr) {
    let sumSq = 0;
    for (let i = 0; i < int16arr.length; i++) sumSq += int16arr[i] * int16arr[i];
    return Math.sqrt(sumSq / int16arr.length);
  }

  async function ensureSession() {
    if (sessionId) return sessionId;
    const res = await fetch('/voice/session', { method: 'POST' });
    const data = await res.json();
    sessionId = data.sessionId;
    return sessionId;
  }

  function getMicWorkletUrl() {
    const code = `
      class MicCapture extends AudioWorkletProcessor {
        constructor() {
          super();
          this._buffer = [];
          this._chunkSamples = 1600; // 100ms at 16kHz
        }
        process(inputs) {
          const input = inputs[0][0];
          if (!input) return true;
          for (let i = 0; i < input.length; i++) {
            const s = Math.max(-1, Math.min(1, input[i]));
            this._buffer.push(s < 0 ? s * 0x8000 : s * 0x7FFF);
          }
          while (this._buffer.length >= this._chunkSamples) {
            const chunk = this._buffer.splice(0, this._chunkSamples);
            this.port.postMessage(new Int16Array(chunk));
          }
          return true;
        }
      }
      registerProcessor('mic-capture', MicCapture);
    `;
    return URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
  }

  async function startCall() {
    try {
      await ensureSession();

      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${wsProtocol}//${location.host}/ws/voice/session/${sessionId}`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        callActive = true;
        btn.classList.add('active');
        btn.textContent = '⏹';
        setStatus('Listening…', 'listening');
        addMessage('system', 'Call connected — agent is greeting you…');
        await startMic();

        // Keep the WebSocket alive across idle proxies.
        ws._heartbeat = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }));
        }, 10000);
      };

      ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
          pendingDecodes++;
          playReplyAudio(event.data);
          return;
        }
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'pong') return;
          if (msg.type === 'user_transcript') {
            serverProcessing = true;
            audioTurnComplete = false; // new turn starting
            addMessage('user', msg.text, msg.language);
            setStatus('Thinking…', 'speaking');
          } else if (msg.type === 'agent_reply_text') {
            addMessage('assistant', msg.text, msg.language);
          } else if (msg.type === 'agent_audio_end') {
            // Server has sent all WAVs for this turn. Only call onAllAudioDone
            // when both pendingDecodes AND playingCount are 0 — decodeAudioData
            // is async so WAVs may still be decoding when this message arrives.
            audioTurnComplete = true;
            if (msg.endCall) pendingCallEnd = true;
            if (playingCount === 0 && pendingDecodes === 0) onAllAudioDone();
          } else if (msg.type === 'call_end') {
            pendingCallEnd = true;
            audioTurnComplete = true;
            if (playingCount === 0 && pendingDecodes === 0) onAllAudioDone();
          } else if (msg.type === 'error') {
            addMessage('system', 'Error: ' + msg.message);
            setStatus(msg.message, 'error');
          }
        } catch {
          /* ignore malformed frame */
        }
      };

      ws.onerror = () => setStatus('Connection error.', 'error');
      ws.onclose = () => { if (callActive) endCall(); };
    } catch (err) {
      console.error(err);
      setStatus('Could not start the call — see console.', 'error');
    }
  }

  async function startMic() {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    await audioCtx.audioWorklet.addModule(getMicWorkletUrl());

    const source = audioCtx.createMediaStreamSource(micStream);
    workletNode = new AudioWorkletNode(audioCtx, 'mic-capture');

    workletNode.port.onmessage = (e) => {
      const chunk = new Int16Array(e.data);

      // Agent owns the floor (speaking or processing) — hard mute. No barge-in:
      // barge-in was causing the agent's own audio to echo through the mic and
      // trigger a new turn on top of the current one (two voices at once).
      if (playingCount > 0 || serverProcessing) return;

      // Energy gate: don't send near-silent chunks to the server.
      // This filters ambient noise and reduces the chance of a distant
      // background voice accumulating into a flush on the server.
      const energy = rms(chunk);
      if (energy < MIN_TRANSMIT_RMS) return;

      // User is speaking and agent is idle — stream to server.
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(chunk.buffer);
      }
    };

    source.connect(workletNode);
    workletNode.connect(audioCtx.destination);
  }

  function endCall() {
    callActive = false;
    stopCurrentPlayback();
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    if (workletNode) { try { workletNode.disconnect(); } catch {} workletNode = null; }
    if (audioCtx) { try { audioCtx.close(); } catch {} audioCtx = null; }
    if (ws) {
      if (ws._heartbeat) clearInterval(ws._heartbeat);
      try { ws.close(); } catch {}
      ws = null;
    }
    sessionId = null; // fresh session next call
    btn.classList.remove('active');
    btn.textContent = '📞';
    setStatus('Call ended. Press to start again.');
    addMessage('system', 'Call ended.');
  }

  btn.addEventListener('click', () => {
    if (callActive) endCall();
    else startCall();
  });

  addMessage('assistant', "Press the call button, then just talk — English, Hindi, or Gujarati.");
</script>
</body>
</html>
