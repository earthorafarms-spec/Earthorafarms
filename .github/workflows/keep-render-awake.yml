name: Keep Render voice service awake

on:
  schedule:
    # Five minutes leaves room for occasional GitHub scheduler delays while
    # remaining comfortably inside Render's free-service idle window.
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-render-awake.yml"
      - "voice-service/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-voice-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check voice-service health
        run: |
          curl --fail --silent --show-error \
            --max-time 75 \
            --retry 2 \
            --retry-delay 5 \
            --user-agent "earthora-github-heartbeat/1.0" \
            "https://earthorafarms-mhwv.onrender.com/health?source=github-actions"
