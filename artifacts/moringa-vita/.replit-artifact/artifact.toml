kind = "web"
previewPath = "/"
title = "Moringa Vita"
version = "1.0.0"
id = "artifacts/moringa-vita"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18938

[services.development]
run = "pnpm --filter @workspace/moringa-vita run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moringa-vita", "run", "build" ]
serve = "static"
publicDir = "artifacts/moringa-vita/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18938"
BASE_PATH = "/"
