name: earthora-livekit
services:
  sfu:
    image: livekit/livekit-server:v1.9.12
    container_name: earthora-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yml:/etc/livekit.yaml:ro
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
  voice-control:
    build: { context: ./server, dockerfile: Dockerfile.earthora }
    image: earthora-livekit-agent:latest
    container_name: earthora-voice-control
    restart: unless-stopped
    command: ['uvicorn', 'earthora_control:app', '--host', '0.0.0.0', '--port', '7860', '--no-access-log']
    env_file: ./server/.env
    environment:
      LIVEKIT_URL: ws://host.docker.internal:7880
      EARTHORA_API_URL: http://api:4100
    # Verified gateway of earthora_default; SFU signaling binds only here and loopback.
    extra_hosts: ['host.docker.internal:172.18.0.1']
    ports: ['127.0.0.1:7860:7860']
    networks: [earthora]
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
  agent:
    image: earthora-livekit-agent:latest
    container_name: earthora-livekit-agent
    restart: unless-stopped
    network_mode: host
    env_file: ./server/.env
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      EARTHORA_API_URL: http://127.0.0.1:4100
    depends_on: [sfu]
    mem_limit: 4g
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
networks:
  earthora: { external: true, name: earthora_default }
