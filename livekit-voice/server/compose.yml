services:
  schoolexl-token-server:
    build: .
    command: ["uv", "run", "token_server.py"]
    env_file: .env
    network_mode: host
    volumes:
      - ./google:/app/google:ro
    restart: unless-stopped

  schoolexl-agent:
    build: .
    command: ["sh", "-c", "uv run agent.py download-files && uv run agent.py start"]
    env_file: .env
    network_mode: host
    volumes:
      - ./google:/app/google:ro
    restart: unless-stopped
