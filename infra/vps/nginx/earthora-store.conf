server {
    server_name earthora.srv1915512.hstgr.cloud;
    root /opt/earthora/www/store;
    index index.html;
    client_max_body_size 30m;

    location /api/     { proxy_pass http://127.0.0.1:4100; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_read_timeout 120s; }
    location /media/   { proxy_pass http://127.0.0.1:4100; proxy_set_header Host $host; }
    location /widget.js { proxy_pass http://127.0.0.1:4100; }
    location /assistant/ { proxy_pass http://127.0.0.1:4100; }
    location /webhooks/ { proxy_pass http://127.0.0.1:4100; proxy_set_header Host $host; }
    # Telephony bridge (earthora-voice, 127.0.0.1:4200). WebSocket upgrade is
    # declared inline rather than via a map in the shared nginx.conf, which
    # other tenants on this host also use.
    location /ws/voice/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # Dynamic endpoint resolver the telephony platform can call to discover
    # the socket URL.
    location /voice/stream/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/earthora.srv1915512.hstgr.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/earthora.srv1915512.hstgr.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = earthora.srv1915512.hstgr.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80; listen [::]:80;
    server_name earthora.srv1915512.hstgr.cloud;
    return 404; # managed by Certbot


}