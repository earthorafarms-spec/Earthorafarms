services:
  - type: web
    name: earthora-voice-service
    runtime: node
    rootDir: voice-service
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      # Set in the Render dashboard — never commit real values.
      - key: PUBLIC_APP_URL
        sync: false
      - key: MAIN_APP_NETLIFY_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      # Canonical public telephony socket, for example:
      # wss://earthora-voice-service.onrender.com/ws/voice/smartflo
      - key: VOICE_STREAM_PUBLIC_WSS_URL
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_STT_LANGUAGE_CODE
        value: en-IN
      - key: GOOGLE_TTS_LANGUAGE_CODE
        value: en-IN
      - key: GOOGLE_TTS_VOICE_NAME
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TOKEN_SIGNING_SECRET
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: VOICE_CHECKOUT_TTL_MINUTES
        value: "30"
