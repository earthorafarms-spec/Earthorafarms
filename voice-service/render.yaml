services:
  - type: web
    name: earthora-voice-service
    runtime: node
    rootDir: .
    plan: starter
    buildCommand: cd voice-service && npm ci --include=dev --no-audit --no-fund --loglevel=info && npm run build
    startCommand: cd voice-service && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      # Set in the Render dashboard — never commit real values.
      - key: PUBLIC_APP_URL
        sync: false
      - key: MAIN_APP_NETLIFY_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_STT_MODEL
        value: gpt-4o-mini-transcribe
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_API_KEYS
        sync: false
      - key: SARVAM_KEY_COOLDOWN_MS
        value: "300000"
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: STT_PROVIDER
        value: openai
      - key: TTS_PROVIDER
        value: auto
      - key: SARVAM_STT_MODEL
        value: saaras:v3
      - key: SARVAM_STT_MIN_LANGUAGE_PROBABILITY
        value: "0.6"
      - key: SARVAM_TTS_SPEAKER
        value: neha
      - key: VOICE_STT_TIMEOUT_MS
        value: "15000"
      - key: VOICE_LLM_TIMEOUT_MS
        value: "30000"
      - key: VOICE_TTS_TIMEOUT_MS
        value: "15000"
      - key: VOICE_SPEECH_RMS_THRESHOLD
        value: "600"
      # Canonical public telephony socket, for example:
      # wss://earthora-voice-service.onrender.com/ws/voice/smartflo
      - key: VOICE_STREAM_PUBLIC_WSS_URL
        sync: false
      - key: WHATSAPP_PROVIDER
        value: tata_omni
      - key: TATA_OMNI_ACCESS_TOKEN
        sync: false
      - key: TATA_OMNI_API_BASE_URL
        value: https://wb.omni.tatatelebusiness.com
      - key: TATA_OMNI_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_CHECKOUT_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_CHECKOUT_TEMPLATE_LANGUAGE
        value: en
      - key: GOOGLE_CLOUD_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_STT_LANGUAGE_CODE
        value: en-IN
      - key: GOOGLE_TTS_LANGUAGE_CODE
        value: en-IN
      - key: GOOGLE_TTS_VOICE_NAME
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TOKEN_SIGNING_SECRET
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: VOICE_CHECKOUT_TTL_MINUTES
        value: "30"
