[project]
name = "schxl-mntr-server"
version = "0.1.0"
description = "SchXl Mentor Server - LiveKit AI Voice/Chat Agent"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "livekit-agents[bey,deepgram,google,openai,silero,tavus,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation>=0.2.5",
    "livekit-api>=1.1.0",
    "google-cloud-texttospeech>=2.26.0",
    "httpx>=0.27.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "websockets>=12.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "flake8>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
