name: Keep Render voice service awake

on:
  schedule:
    # Render Free sleeps after 15 idle minutes. Use off-peak minute marks to
    # reduce GitHub scheduler delays around the start of each hour.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-voice-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check voice-service health
        run: |
          curl --fail --silent --show-error \
            --max-time 75 \
            --retry 2 \
            --retry-delay 5 \
            https://earthorafarms-mhwv.onrender.com/health
