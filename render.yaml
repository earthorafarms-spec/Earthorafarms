services:
  - type: web
    name: earthora-voice-service
    runtime: node
    rootDir: voice-service
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free          # upgrade to "starter" ($7/mo) for always-on in production
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Set these in the Render dashboard — do NOT put real values here
      - key: PUBLIC_APP_URL
        sync: false     # your main Netlify site URL e.g. https://earthora.netlify.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LLM_PROVIDER
        value: openai
      - key: STT_PROVIDER
        value: sarvam
      - key: TTS_PROVIDER
        value: auto
      - key: SARVAM_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TOKEN_SIGNING_SECRET
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: MAIN_APP_NETLIFY_URL
        sync: false     # same as PUBLIC_APP_URL — used to fire invoice emails
